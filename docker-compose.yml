services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: enterping-app:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://enterping:enterping@db:5432/enterping
      AUTH_SECRET: ${AUTH_SECRET:-TW/Ebz+ea4AXD1ChlFdfxfH43seh08a+Bbk8v4cvRms=}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      CRON_SECRET: ${CRON_SECRET:-}
    ports:
      - "3000:3000"
    volumes:
      - ./data/jpop-lyrics:/app/data/jpop-lyrics
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: enterping
      POSTGRES_USER: enterping
      POSTGRES_PASSWORD: enterping
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterping -d enterping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
